services:
  wazuh.manager:
    image: wazuh/wazuh-manager:4.9.2
    hostname: wazuh.manager
    restart: always
    ulimits: {memlock: {soft: -1, hard: -1}, nofile: {soft: 655360, hard: 655360}}
    ports: ["1514:1514", "1515:1515", "514:514/udp", "55000:55000"]
    environment:
      INDEXER_URL: https://wazuh.indexer:9200
      INDEXER_USERNAME: admin
      INDEXER_PASSWORD: ${INDEXER_PASSWORD}
      API_PASSWORD: ${WAZUH_API_PASSWORD}
    volumes:
      - wazuh_etc:/var/ossec/etc
      - wazuh_logs:/var/ossec/logs
      - ./rules/local_rules.xml:/var/ossec/etc/rules/local_rules.xml:ro

  wazuh.indexer:
    image: wazuh/wazuh-indexer:4.9.2
    hostname: wazuh.indexer
    restart: always
    ulimits: {memlock: {soft: -1, hard: -1}, nofile: {soft: 65536, hard: 65536}}
    environment: {OPENSEARCH_JAVA_OPTS: "-Xms2g -Xmx2g"}
    volumes: [wazuh-indexer-data:/var/lib/wazuh-indexer]

  wazuh.dashboard:
    image: wazuh/wazuh-dashboard:4.9.2
    hostname: wazuh.dashboard
    restart: always
    ports: ["443:5601"]
    environment:
      INDEXER_USERNAME: admin
      INDEXER_PASSWORD: ${INDEXER_PASSWORD}
      WAZUH_API_URL: https://wazuh.manager
      API_PASSWORD: ${WAZUH_API_PASSWORD}
    depends_on: [wazuh.indexer]

  netflow:
    image: elastiflow/flow-collector:7.5.2
    restart: always
    ports: ["2055:2055/udp"]
    environment:
      EF_OUTPUT_OPENSEARCH_ENABLE: "true"
      EF_OUTPUT_OPENSEARCH_ADDRESSES: wazuh.indexer:9200
      EF_OUTPUT_OPENSEARCH_USERNAME: admin
      EF_OUTPUT_OPENSEARCH_PASSWORD: ${INDEXER_PASSWORD}
      EF_OUTPUT_OPENSEARCH_TLS_ENABLE: "true"
      EF_OUTPUT_OPENSEARCH_TLS_SKIP_VERIFICATION: "true"

volumes:
  wazuh_etc: {}
  wazuh_logs: {}
  wazuh-indexer-data: {}
